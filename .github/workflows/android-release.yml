name: Build and Release Android APK

on:
  push:
    branches:
      - main # Triggers on every commit to main branch
  pull_request:
    branches:
      - main # Also triggers on PRs to main for validation

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release and upload assets

    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.0
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Quality Checks
        run: |
          if [ -f "local.properties" ] && grep -q "android-tools.dir" local.properties; then
            ./gradlew detekt spotlessCheck buildHealth
          else
            echo "Quality tools not configured (android-tools missing). Skipping detekt/spotless/buildHealth."
          fi

      - name: Run Tests
        run: |
          if [ -d "app/src/test" ]; then
            ./gradlew test
          else
            echo "No tests found. Skipping test execution."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK exists
        run: |
          echo "=== Listing APK directory ==="
          ls -la app/build/outputs/apk/debug/ || echo "Directory does not exist"
          echo "=== Finding all APK files ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== Checking for app-debug.apk ==="
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "SUCCESS: Found app-debug.apk"
          else
            echo "WARNING: app-debug.apk not found, checking for other APK names..."
            ls app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No APK files in debug directory"
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: debug-build-${{ github.sha }}
          name: Debug Build ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
