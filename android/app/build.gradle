plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Shared upload key + quality tooling.
def toolsDir = null
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    def props = new Properties()
    localPropsFile.withInputStream { props.load(it) }
    toolsDir = props.getProperty('android-tools.dir')
}

// Fallback for CI environments where local.properties doesn't exist
if (toolsDir == null || !file(toolsDir).exists()) {
    // In CI, we don't have the custom tools directory
    // Use default Android SDK path and skip custom signing for now
    toolsDir = null
}

android {
    namespace 'com.tecepeipe.bugzstrategy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tecepeipe.bugzstrategy'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            if (toolsDir != null) {
                storeFile file("$toolsDir/upload-release.keystore")
                storePassword 'tecepeipe123'
                keyAlias 'upload'
                keyPassword 'tecepeipe123'
            } else {
                // CI environment - use debug signing or skip
                // GitHub Actions will handle signing via secrets if needed
                storeType 'NONE'
            }
        }
    }

    buildTypes {
        release {
            if (toolsDir != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Shared quality tooling (detekt + spotless + JUnit), see
// android-tools/quality/quality.gradle.
if (toolsDir != null && file("$toolsDir/quality/quality.gradle").exists()) {
    apply from: "$toolsDir/quality/quality.gradle"
} else {
    // CI environment - skip custom quality tools that depend on local setup
    // Basic linting will still run via Android Gradle Plugin
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}