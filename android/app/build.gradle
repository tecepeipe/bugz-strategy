plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Shared upload key + quality tooling.
// Note: Quality tooling requires android-tools directory with quality.gradle
// If android-tools is not available, comment out the apply line below
def props = new Properties()
def localPropsFile = rootProject.file('local.properties')
def toolsDir = null

if (localPropsFile.exists()) {
    props.load(localPropsFile.newInputStream())
    toolsDir = props.getProperty('android-tools.dir')
}

if (toolsDir && file("$toolsDir/quality/quality.gradle").exists()) {
    // Quality tooling will be applied below
} else {
    toolsDir = null  // Disable quality tooling if not found
}

android {
    namespace 'com.tecepeipe.bugzstrategy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tecepeipe.bugzstrategy'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile file("$toolsDir/upload-release.keystore")
            storePassword 'tecepeipe123'
            keyAlias 'upload'
            keyPassword 'tecepeipe123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Shared quality tooling (detekt + spotless + JUnit) - only apply if android-tools is available
if (toolsDir) {
    apply from: "$toolsDir/quality/quality.gradle"
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.22'
}